name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project and overlay my files
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          flutter create --org com.example --project-name offline_mesh --platforms=android .
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib $GITHUB_WORKSPACE/pubspec.yaml .
          cp $GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml android/app/src/main/
          cp $GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/offline_mesh/MainActivity.kt android/app/src/main/kotlin/com/example/offline_mesh/
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 29/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 29/' android/app/build.gradle* || true
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: offline-mesh-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
